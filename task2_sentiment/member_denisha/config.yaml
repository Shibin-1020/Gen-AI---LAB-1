seed: 20260929
data_path: ../data/yelp_polarity.csv
max_vocab_size: 30000
max_length: 256
batch_size: 512
epochs: 12
learning_rate: 0.001
weight_decay: 0.0001
validation_fraction: 0.1
lr_factor: 0.5
lr_patience: 1
min_learning_rate: 0.000001
early_stopping_patience: 3
min_delta: 0.0001
num_workers: 4
eval_workers: 2
prefetch_factor: 4
pin_memory: true
amp: true
precision: bfloat16
device: auto
remove_stopwords: true
stemming: true
models:
  baseline:
    type: bow_mlp
    embedding_dim: 128
    hidden_dim: 128
    dropout: 0.2
  experimental_cnn:
    type: text_cnn
    embedding_dim: 128
    channels: 128
    kernel_sizes: [3, 4, 5]
    dropout: 0.3
  experimental_gru:
    type: gru
    embedding_dim: 128
    hidden_dim: 128
    layers: 2
    dropout: 0.3

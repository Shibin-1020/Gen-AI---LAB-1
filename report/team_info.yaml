# Team information for the combined report. Edit this file, then rebuild the PDF:
#     python report/build_report.py
# Shibin Thomas's numbers are read directly from the committed result files, so they are
# not typed here. Each teammate fills in their own section below with the values from their
# own results.md / metrics_report.csv. Leave a value as null if it is not available yet:
# the report then shows "pending".

team_number: "09"
team_name: PairProgramming_Team_09
repo_url: https://github.com/Shibin-1020/Gen-AI---LAB-1
repo_branch: shibin-lab1
report_date: October 2026
members:
- name: Shibin Thomas
  folder: shibin_thomas
  built: the character-level GPT for Task 1, the mean-pooling baseline, TextCNN and BiGRU-with-attention classifiers
    for Task 2, and the CycleGAN for Task 3, including the Kaggle submission. Shibin also set up the shared TinyStories
    download, the shared metric modules for Tasks 1 and 2, the repository layout, the run manifests and the smoke
    tests.
- name: Denisha Ketan Tank
  folder: member_denisha
  branch: denisha-lab1
  built: an independent character-level GPT for Task 1, a mean-pooling baseline, TextCNN and bidirectional GRU classifiers
    for Task 2, and a CycleGAN for Task 3, together with the team's best Kaggle submission and its official evaluation

seed: 20260929
data_path: ../data/TinyStories-train.jsonl
train_samples: 100000
validation_samples: 10000
sequence_length: 128
# Non-overlapping chunks avoid duplicating almost every character as a new sample.
stride: 128
batch_size: 48
embedding_dim: 256
num_heads: 4
num_layers: 4
feedforward_dim: 1024
dropout: 0.1
learning_rate: 0.0005
weight_decay: 0.01
betas: [0.9, 0.999]
warmup_steps: 500
min_lr_ratio: 0.1
epochs: 10
gradient_clip_norm: 1.0
num_workers: 0
log_interval_batches: 50
save_every_epoch: true
checkpoint_every_batches: 500
amp: true
# T4-compatible mixed precision. The training code also falls back safely on
# GPUs that do not support bfloat16.
precision: float16
pin_memory: true
resume_from: null
device: auto
